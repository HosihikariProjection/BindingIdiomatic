name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          path: Binding.Abi

      - name: Endstone Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/EndstoneBinding
          path: Binding.Endstone

      - name: LeviLamina Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/LeviLaminaBinding
          path: Binding.LeviLamina

      - name: Bedrock Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BedrockBinding
          path: Binding.Bedrock

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: >
          dotnet build Hosihikari.Binding.slnx -c Release
          -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj
          -p:EndstoneInteropProjectPath=${{ github.workspace }}/Binding.Endstone/src/Hosihikari.Bindings.Endstone.Interop/Hosihikari.Bindings.Endstone.Interop.csproj
          -p:LeviLaminaInteropProjectPath=${{ github.workspace }}/Binding.LeviLamina/src/Hosihikari.Bindings.LeviLamina.Interop/Hosihikari.Bindings.LeviLamina.Interop.csproj

      - name: Test
        run: >
          dotnet run --project tests/Hosihikari.Binding.Tests/Hosihikari.Binding.Tests.csproj -c Release
          -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify manifests
        run: python3 scripts/verify_manifests.py
