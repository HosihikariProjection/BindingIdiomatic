name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Pinned so a push to a sibling repository cannot change what this run packs;
      # bump the pair together with the package versions they are packed against.
      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          path: Binding.Abi
          ref: 0cefbb52067d31c8488269d2f1a701624c3a8729

      - name: Endstone Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/EndstoneBinding
          path: Binding.Endstone
          ref: 53512018a19e895971e37543d37ed37b7511f186

      - name: LeviLamina Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/LeviLaminaBinding
          path: Binding.LeviLamina

      # The Bedrock repository is branched per surface version, and its default branch is the
      # frozen v1.21.3. Derive the branch from the package version so an upgrade cannot leave
      # this pinned to the previous surface.
      - name: Resolve the Bedrock surface branch
        id: bedrock-ref
        run: |
          version="$(awk -F'[<>]' '/<Version>/{print $3; exit}' src/Hosihikari.Binding.Bedrock/Hosihikari.Binding.Bedrock.csproj)"
          echo "ref=v${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Bedrock Interop
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BedrockBinding
          path: Binding.Bedrock
          ref: ${{ steps.bedrock-ref.outputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A tag only means something if it agrees with the pair it was cut against,
      # so the tag must spell the version and both sides must carry it.
      - name: Versions agree with the pair and the tag
        run: |
          python3 scripts/check_versions.py . ${{ github.workspace }}
          tag_version="${GITHUB_REF_NAME#v}"
          for project in src/*/*.csproj; do
            case "$project" in
              */Hosihikari.Binding/*|*/Hosihikari.Binding.csproj) continue ;;
            esac
            grep -q "<Version>$tag_version</Version>" "$project"               || { echo "$project is not at $tag_version"; exit 1; }
          done

      - name: Manifests resolve
        run: python3 scripts/verify_manifests.py . ${{ github.workspace }}

      - name: Test
        run: >
          dotnet run --project tests/Hosihikari.Binding.Tests/Hosihikari.Binding.Tests.csproj -c Release
          -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Pack
        run: >
          dotnet pack Hosihikari.Binding.slnx -c Release -o artifacts/package
          -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj
          -p:EndstoneInteropProjectPath=${{ github.workspace }}/Binding.Endstone/src/Hosihikari.Bindings.Endstone.Interop/Hosihikari.Bindings.Endstone.Interop.csproj
          -p:LeviLaminaInteropProjectPath=${{ github.workspace }}/Binding.LeviLamina/src/Hosihikari.Bindings.LeviLamina.Interop/Hosihikari.Bindings.LeviLamina.Interop.csproj
          -p:BedrockInteropProjectPath=${{ github.workspace }}/Binding.Bedrock/src/Hosihikari.Bindings.Bedrock.Interop/Hosihikari.Bindings.Bedrock.Interop.csproj

      # A nested project reference carries no version into the nuspec, so the packed
      # dependency comes out as a bare minimum; ADR-0027 wants the exact pair.
      - name: Pin the pair to an exact range
        run: python3 scripts/check_package_dependencies.py artifacts/package

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/package/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/HosihikariProjection/index.json
          --skip-duplicate

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/package/*.nupkg
          generate_release_notes: true
